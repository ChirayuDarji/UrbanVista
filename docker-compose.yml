version: "3.9"
services:
  web:
    build: .
    command: gunicorn mysite.wsgi:application -b 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=mysite.settings
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - db

  worker:
    build: .
    command: celery -A mysite worker -l info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=mysite.settings
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - db

  beat:
    build: .
    command: celery -A mysite beat -l info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=mysite.settings
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mysite
      - POSTGRES_USER=mysite
      - POSTGRES_PASSWORD=mysite
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:


