{% extends "base.html" %}
{% load static %}

{% block title %}Delete Document — UrbanVista{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
<style>
.delete-page {
    padding: 40px 20px;
    background: var(--uv-c-surface-1, var(--surface, #121826));
    min-height: 100vh;
    display: grid;
    place-items: center;
}

.delete-container {
    max-width: 600px;
    margin: 0 auto;
    background: var(--elev);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid var(--border);
    text-align: center;
}

.delete-container h1 {
    font-size: 28px;
    margin-bottom: 16px;
    color: var(--text);
}

.delete-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
}

.btn {
    padding: 12px 24px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
}

.btn-danger {
    background: var(--error, #ef4444);
    color: #fff;
}

.btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
}
</style>
{% endblock %}

{% block content %}
<section class="delete-page">
    <div class="delete-container">
        <h1><i class="fas fa-exclamation-triangle" style="color: var(--error, #ef4444);"></i> Delete Document</h1>
        <p style="color: var(--muted);">Are you sure you want to delete "{{ document.title }}"?</p>
        
        <form method="post" class="delete-actions">
            {% csrf_token %}
            <a href="{% url 'projects:detail' document.project.slug %}" class="btn btn-outline">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-trash"></i> Delete
            </button>
        </form>
    </div>
</section>
{% endblock %}
